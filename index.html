<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy 18th, Choozi</title>
<meta name="theme-color" content="#1b1038">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#1b1038;
    --night-2:#2a1758;
    --rose:#ff5d8f;
    --blush:#ffc2d6;
    --gold:#ffd166;
    --lilac:#b9a4ff;
    --ink:#fff7fb;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{background:var(--night)}
  body{
    min-height:100vh;
    font-family:"Bricolage Grotesque",system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(90vmax 60vmax at 85% -10%, #5a2a8f55, transparent 60%),
      radial-gradient(70vmax 50vmax at -10% 40%, #ff5d8f22, transparent 60%),
      var(--night);
    overflow-x:hidden;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  #fx{position:fixed;inset:0;pointer-events:none;z-index:50}
  main{max-width:560px;margin:0 auto;padding:36px 20px 64px;position:relative}

  .hand{font-family:"Caveat",cursive;font-weight:700}
  h1{
    font-weight:800;font-size:clamp(44px,14vw,76px);line-height:.95;letter-spacing:-.03em;
    margin-top:6px;
    background:linear-gradient(100deg,var(--blush),var(--rose) 55%,var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{font-family:"Caveat",cursive;font-size:28px;color:var(--blush);margin-top:10px}

  /* countdown */
  .count{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:28px}
  .unit{
    background:linear-gradient(160deg,#ffffff14,#ffffff06);
    border:1px solid #ffffff22;border-radius:18px;padding:14px 4px 10px;text-align:center;
  }
  .unit b{display:block;font-size:clamp(28px,9vw,42px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
  .unit span{display:block;font-size:13px;color:var(--lilac);margin-top:6px}
  .count-note{margin-top:12px;font-size:15px;color:var(--lilac)}
  .today{
    display:none;margin-top:28px;padding:20px;border-radius:20px;text-align:center;
    background:linear-gradient(120deg,var(--rose),#a259ff);font-size:22px;font-weight:800;
  }
  body.is-today .count,body.is-today .count-note{display:none}
  body.is-today .today{display:block}

  /* actions */
  .row{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
  button{font:inherit;color:inherit;cursor:pointer;border:0}
  .btn{
    padding:13px 20px;border-radius:999px;font-weight:800;font-size:16px;
    background:var(--gold);color:#3b1d00;
  }
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid #ffffff44}
  button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

  /* stars */
  h2{font-size:24px;font-weight:800;letter-spacing:-.01em;margin-top:44px}
  .hint{color:var(--lilac);font-size:16px;margin-top:6px}
  .progress{height:6px;border-radius:9px;background:#ffffff18;margin-top:14px;overflow:hidden}
  .progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rose),var(--gold));transition:width .4s}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
  .tile{
    aspect-ratio:1;border-radius:22px;position:relative;
    background:linear-gradient(155deg,var(--night-2),#3a1f73);
    border:1px solid #ffffff26;
    font-weight:800;font-size:30px;
    display:flex;align-items:center;justify-content:center;
    transition:transform .15s, background .3s;
  }
  .tile:active{transform:scale(.92)}
  .tile small{position:absolute;right:10px;bottom:8px;font-size:15px;opacity:0}
  .tile.seen{background:linear-gradient(155deg,#ff5d8f,#a259ff);border-color:transparent}
  .tile.seen small{opacity:1}
  .tile.final{grid-column:1/-1;aspect-ratio:auto;padding:22px;font-size:20px;background:linear-gradient(120deg,#ffffff10,#ffffff06);border-style:dashed}
  .tile.final.ready{background:linear-gradient(120deg,var(--gold),var(--rose));color:#3b1d00;border-style:solid;border-color:transparent}

  /* message sheet */
  .veil{position:fixed;inset:0;background:#0a041acc;display:none;z-index:40}
  .veil.open{display:block}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:45;
    max-width:560px;margin:0 auto;
    background:linear-gradient(170deg,#3a1f73,#1b1038 70%);
    border:1px solid #ffffff2a;border-bottom:0;border-radius:28px 28px 0 0;
    padding:26px 24px calc(26px + env(safe-area-inset-bottom));
    transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.9,.3,1);
  }
  .sheet.open{transform:none}
  .tag{
    display:inline-block;padding:5px 12px;border-radius:99px;font-size:14px;font-weight:800;
    background:#ffffff1a;color:var(--gold);
  }
  .msg{font-family:"Caveat",cursive;font-size:clamp(28px,8vw,36px);line-height:1.2;margin:16px 0 22px;min-height:132px}
  .sheet .row{margin-top:0}

  @media (prefers-reduced-motion:reduce){
    .sheet,.tile,.progress i{transition:none}
  }
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>

<main>
  <p class="hand" style="font-size:26px;color:var(--gold)">for my Choozi</p>
  <h1>Happy 18th, baby girl</h1>
  <p class="sub">26 September 2026</p>

  <div class="count" id="count" role="timer" aria-live="off">
    <div class="unit"><b id="d">--</b><span>days</span></div>
    <div class="unit"><b id="h">--</b><span>hours</span></div>
    <div class="unit"><b id="m">--</b><span>minutes</span></div>
    <div class="unit"><b id="s">--</b><span>seconds</span></div>
  </div>
  <p class="count-note">until your birthday begins</p>
  <div class="today">It's your day, Choozi. Happy 18th!</div>

  <div class="row">
    <button class="btn" id="song">Play birthday song</button>
    <button class="btn ghost" id="random">Surprise me</button>
  </div>

  <h2>18 messages for your 18th</h2>
  <p class="hint">Tap each one. Every tile plays its own note.</p>
  <div class="progress" aria-hidden="true"><i id="bar"></i></div>
  <div class="grid" id="grid"></div>
</main>

<div class="veil" id="veil"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Message">
  <span class="tag" id="tag"></span>
  <p class="msg" id="msg"></p>
  <div class="row">
    <button class="btn" id="next">Next one</button>
    <button class="btn ghost" id="close">Close</button>
  </div>
</div>

<script>
/* ============ EDIT ME ============
   Change the date, name or any message below. */
const BIRTHDAY = new Date(2026, 8, 26, 0, 0, 0); // 26 Sept 2026, local time (month is 0-based)

const MESSAGES = [
  ["Wish",  "Happy 18th, Choozi! May this year open every door you've been dreaming about."],
  ["Love",  "You make my ordinary days feel like something worth celebrating."],
  ["Wish",  "I hope today is full of cake, laughter and everyone who loves you."],
  ["Love",  "Your smile is my favourite thing to wake up to, even through a screen."],
  ["Wish",  "May 18 be your best year yet, and the start of even better ones."],
  ["Love",  "I'm so proud of who you are and who you're becoming."],
  ["Wish",  "I wish you peace on hard days and big, loud joy on good ones."],
  ["Love",  "Thank you for being patient with me, and for being you."],
  ["Wish",  "May everything you work for finally start working for you."],
  ["Love",  "With you, even silence feels like home."],
  ["Wish",  "I hope you never forget how strong and special you are."],
  ["Love",  "You're my favourite person to talk to, and I never run out of things to tell you."],
  ["Wish",  "May your heart always be as beautiful as it is right now."],
  ["Love",  "I'd choose you again in every version of every day."],
  ["Wish",  "You're an adult now. Go be brave, be silly and be exactly you."],
  ["Love",  "Every plan I make for the future has you somewhere in it."],
  ["Wish",  "Make a wish, baby girl. I'll spend my life helping it come true."],
  ["Love",  "I love you, Choozi. Today, tomorrow and always."]
];
const FINAL = "Now that you've opened all 18: you are loved, you are enough, and you are my whole world. Happy birthday, my Choozi. ❤";
/* =============================== */

const $ = id => document.getElementById(id);
const seen = new Set();
let current = -1;

/* ---------- countdown ---------- */
function tick(){
  const diff = BIRTHDAY - new Date();
  if (diff <= 0){
    if (!document.body.classList.contains("is-today")){
      document.body.classList.add("is-today");
      burst(innerWidth/2, innerHeight/3, 140);
    }
    return;
  }
  const s = Math.floor(diff/1000);
  $("d").textContent = Math.floor(s/86400);
  $("h").textContent = String(Math.floor(s%86400/3600)).padStart(2,"0");
  $("m").textContent = String(Math.floor(s%3600/60)).padStart(2,"0");
  $("s").textContent = String(s%60).padStart(2,"0");
}
tick(); setInterval(tick, 1000);

/* ---------- sound (Web Audio, no files needed) ---------- */
let ac;
function audio(){
  ac = ac || new (window.AudioContext || window.webkitAudioContext)();
  if (ac.state === "suspended") ac.resume();
  return ac;
}
function note(freq, when = 0, dur = .5, vol = .18){
  const a = audio(), t = a.currentTime + when;
  const o = a.createOscillator(), g = a.createGain();
  o.type = "triangle"; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + .02);
  g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + dur + .05);
}
// pentatonic scale so every tile sounds pleasant
const PENTA = [0,2,4,7,9];
function tileNote(i){
  const semis = PENTA[i % 5] + 12 * Math.floor(i / 5);
  return 261.63 * Math.pow(2, semis / 12);
}
// Happy Birthday melody: [semitones from C4, beats]
const SONG = [[0,.75],[0,.25],[2,1],[0,1],[5,1],[4,2],
              [0,.75],[0,.25],[2,1],[0,1],[7,1],[5,2],
              [0,.75],[0,.25],[12,1],[9,1],[5,1],[4,1],[2,1],
              [10,.75],[10,.25],[9,1],[5,1],[7,1],[5,2]];
let playing = false;
$("song").onclick = () => {
  if (playing) return;
  playing = true;
  let t = 0; const beat = .42;
  SONG.forEach(([s, b]) => {
    note(261.63 * Math.pow(2, s/12), t, b*beat*1.4, .2);
    const x = innerWidth * (.15 + Math.random()*.7);
    setTimeout(() => burst(x, innerHeight*.35, 14), t*1000);
    t += b * beat;
  });
  setTimeout(() => { playing = false; burst(innerWidth/2, innerHeight/3, 120); }, t*1000 + 300);
};

/* ---------- tiles ---------- */
const grid = $("grid");
MESSAGES.forEach((_, i) => {
  const b = document.createElement("button");
  b.className = "tile"; b.setAttribute("aria-label", "Message " + (i+1));
  b.innerHTML = (i+1) + "<small>❤</small>";
  b.onclick = e => openMsg(i, e);
  grid.appendChild(b);
});
const fin = document.createElement("button");
fin.className = "tile final"; fin.id = "final";
fin.textContent = "Open all 18 to unlock the last one";
fin.onclick = () => { if (seen.size === MESSAGES.length) showFinal(); };
grid.appendChild(fin);

function updateProgress(){
  $("bar").style.width = (seen.size / MESSAGES.length * 100) + "%";
  if (seen.size === MESSAGES.length){
    fin.classList.add("ready");
    fin.textContent = "Your last message is ready";
  }
}

function openMsg(i, e){
  current = i;
  seen.add(i);
  grid.children[i].classList.add("seen");
  const [tag, text] = MESSAGES[i];
  $("tag").textContent = (tag === "Love" ? "Love note " : "Birthday wish ") + (i+1) + " of 18";
  $("msg").textContent = text;
  note(tileNote(i)); note(tileNote(i) * 1.5, .12, .5, .1);
  const r = e && e.currentTarget ? e.currentTarget.getBoundingClientRect() : null;
  burst(r ? r.left + r.width/2 : innerWidth/2, r ? r.top + r.height/2 : innerHeight/2, 22);
  $("next").style.display = "";
  show(true); updateProgress();
}
function showFinal(){
  current = -1;
  $("tag").textContent = "One more thing";
  $("msg").textContent = FINAL;
  $("next").style.display = "none";
  [0,4,7,12,16].forEach((s,k)=>note(261.63*Math.pow(2,s/12), k*.15, .9));
  burst(innerWidth/2, innerHeight/2, 160);
  show(true);
}
function show(on){
  $("sheet").classList.toggle("open", on);
  $("veil").classList.toggle("open", on);
  if (on) $("close").focus();
}
$("close").onclick = $("veil").onclick = () => show(false);
$("next").onclick = e => {
  const unseen = MESSAGES.map((_,i)=>i).filter(i=>!seen.has(i));
  const pool = unseen.length ? unseen : MESSAGES.map((_,i)=>i).filter(i=>i!==current);
  openMsg(pool[Math.floor(Math.random()*pool.length)], null);
};
$("random").onclick = () => $("next").onclick();
addEventListener("keydown", e => { if (e.key === "Escape") show(false); });

/* ---------- confetti + hearts ---------- */
const cv = $("fx"), cx = cv.getContext("2d");
let parts = [], raf = 0;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function size(){ cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
size(); addEventListener("resize", size);
const COLORS = ["#ff5d8f","#ffd166","#b9a4ff","#ffc2d6","#ffffff"];
function burst(x, y, n){
  if (reduce) n = Math.min(n, 8);
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, v = 2 + Math.random() * 6;
    parts.push({x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v - 3, g: .12,
      life: 70 + Math.random()*50, c: COLORS[i % COLORS.length],
      heart: Math.random() < .4, s: 6 + Math.random()*8, r: Math.random()*6});
  }
  if (!raf) raf = requestAnimationFrame(loop);
}
function heart(x, y, s, c){
  cx.fillStyle = c; cx.beginPath();
  cx.moveTo(x, y + s/4);
  cx.bezierCurveTo(x, y - s/3, x - s, y - s/3, x - s, y + s/4);
  cx.bezierCurveTo(x - s, y + s*.7, x, y + s, x, y + s*1.2);
  cx.bezierCurveTo(x, y + s, x + s, y + s*.7, x + s, y + s/4);
  cx.bezierCurveTo(x + s, y - s/3, x, y - s/3, x, y + s/4);
  cx.fill();
}
function loop(){
  cx.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter(p => p.life > 0);
  parts.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= .99; p.life--;
    cx.globalAlpha = Math.min(1, p.life / 30);
    if (p.heart) heart(p.x, p.y, p.s/2, p.c);
    else { cx.fillStyle = p.c; cx.fillRect(p.x, p.y, p.s/2, p.s); }
  });
  cx.globalAlpha = 1;
  raf = parts.length ? requestAnimationFrame(loop) : 0;
}
</script>
</body>
</html>
